<!doctype html>

<html lang="es">
  <head>
    <title>DevJobs - Inicio</title>

    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Encuentra las mejores ofertas de trabajo para desarrolladores en DevJobs"
    />
  </head>

  <body>
    <header>
      <h2>DevJobs</h2>

      <nav>
        <a href="">Inicio</a>
        <a href="">Empleos</a>
      </nav>

      <div>
        <a href="">Publicar un empleo</a>
        <a href="">Iniciar sesion</a>
      </div>
    </header>

    <main>
      <section>
        <img src="./background.webp" width="200" />

        <h1>Encuentra el trabajo de tus sueños</h1>

        <p>
          Unete a la comunidad mas grande de desarrolladores y encuentra tu
          proxima oportunidad.
        </p>

        <form role="search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-search"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
            <path d="M21 21l-6 -6" />
          </svg>

          <input
            type="text"
            placeholder="Buscar empleo por titulo, habilidad o empresa"
          />

          <button type="submit">Buscar</button>
        </form>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
